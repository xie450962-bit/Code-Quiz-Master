services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: code_quiz_master
      POSTGRES_USER: code_quiz_master
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - code-quiz-master-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_quiz_master -d code_quiz_master"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  code-quiz-master-db:
